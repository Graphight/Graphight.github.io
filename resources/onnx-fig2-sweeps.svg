<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect x="0" y="0" width="720" height="420" rx="6" fill="#ffffff" stroke="#e3e3e0"/><title>Growth tracks distinct threads, not concurrent calls</title><text x="64.0" y="32.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">The two images respond to different variables</text><text x="64.0" y="51.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#6f6e6a" text-anchor="start" font-weight="400">GPU memory growth over 500 requests, cold process per cell</text><line x1="64" y1="76" x2="82" y2="76" stroke="#2a78d6" stroke-width="2"/><circle cx="73" cy="76" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/><text x="89.0" y="80.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">old image</text><line x1="150.4" y1="76" x2="168.4" y2="76" stroke="#eb6834" stroke-width="2"/><circle cx="159.4" cy="76" r="4" fill="#eb6834" stroke="#ffffff" stroke-width="2"/><text x="175.4" y="80.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">new image</text><text x="78.0" y="106.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Semaphore count</text><text x="78.0" y="122.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6f6e6a" text-anchor="start" font-weight="400">concurrent calls allowed inside inference</text><line x1="64" y1="338.0" x2="366" y2="338.0" stroke="#e3e3e0" stroke-width="1"/><line x1="64" y1="268.0" x2="366" y2="268.0" stroke="#e3e3e0" stroke-width="1"/><line x1="64" y1="198.0" x2="366" y2="198.0" stroke="#e3e3e0" stroke-width="1"/><line x1="64" y1="128.0" x2="366" y2="128.0" stroke="#e3e3e0" stroke-width="1"/><text x="78.0" y="358.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6f6e6a" text-anchor="middle" font-weight="400">1</text><text x="215.0" y="358.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6f6e6a" text-anchor="middle" font-weight="400">2</text><text x="352.0" y="358.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6f6e6a" text-anchor="middle" font-weight="400">4</text><text x="432.0" y="106.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Client concurrency</text><text x="432.0" y="122.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6f6e6a" text-anchor="start" font-weight="400">threads sending requests</text><line x1="418" y1="338.0" x2="704" y2="338.0" stroke="#e3e3e0" stroke-width="1"/><line x1="418" y1="268.0" x2="704" y2="268.0" stroke="#e3e3e0" stroke-width="1"/><line x1="418" y1="198.0" x2="704" y2="198.0" stroke="#e3e3e0" stroke-width="1"/><line x1="418" y1="128.0" x2="704" y2="128.0" stroke="#e3e3e0" stroke-width="1"/><text x="432.0" y="358.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6f6e6a" text-anchor="middle" font-weight="400">1</text><text x="496.5" y="358.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6f6e6a" text-anchor="middle" font-weight="400">2</text><text x="561.0" y="358.0" font-family="-apple-system,BlinkMacSystemFont
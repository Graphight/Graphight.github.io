<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/site.css?v=' | append: site.github.build_revision | relative_url }}">

    {% seo %}
    {% include head-custom.html %}
</head>

<body>

<header class="site-header">
    <div class="wrap">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        {% include navigation.html %}
    </div>
</header>

<main class="column">
    {{ content }}
</main>

<footer class="site-footer">
    <div class="wrap">
        <div class="links">
            <a href="https://github.com/Graphight">GitHub</a>
            <a href="https://www.linkedin.com/in/tom-marsh-3aa764154/">LinkedIn</a>
            <a href="https://graphight.itch.io/">itch.io</a>
        </div>
        <span>© {{ site.time | date: "%Y" }} {{ site.title }} · Colours: <a href="https://warmburnout.com/">Warm Burnout</a></span>
    </div>
</footer>
</body>
</html>

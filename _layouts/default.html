<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/site.css?v=' | append: site.github.build_revision | relative_url }}">

    {% seo %}
    {% include head-custom.html %}
</head>

<body>

<header class="site-header">
    <div class="wrap">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        {% include navigation.html %}
    </div>
</header>

<main>
    {{ content }}
</main>

<footer class="site-footer">
    <div class="wrap">
        <div class="links">
            <a href="https://github.com/Graphight">GitHub</a>
            <a href="https://www.linkedin.com/in/tom-marsh-3aa764154/">LinkedIn</a>
            <a href="https://graphight.itch.io/">itch.io</a>
        </div>
        <span>© {{ site.time | date: "%Y" }} {{ site.title }} · Colours: <a href="https://warmburnout.com/">Warm Burnout</a></span>
    </div>
</footer>

<script>
(function () {
  var root = document.documentElement, btn = document.getElementById("theme-toggle");
  var os = matchMedia("(prefers-color-scheme: dark)");
  function current() { return root.dataset.theme || (os.matches ? "dark" : "light"); }
  function label() { btn.textContent = current() === "dark" ? "Switch to light" : "Switch to dark"; }
  btn.hidden = false;
  label();
  os.addEventListener("change", label);
  btn.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
    label();
  });
})();
</script>
</body>
</html>

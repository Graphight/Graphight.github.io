<ol class="timeline">
{%- for role in site.data.experience %}
<li>
<span class="when">{{ role.start }} – {{ role.end }}</span>
<span class="what">{{ role.title }} · {% if role.link %}<a href="{{ role.link }}">{{ role.org }}</a>{% else %}{{ role.org }}{% endif %}</span>
<span class="where">{{ role.place }}</span>
{%- if role.line %}
<span class="line">{{ role.line }}</span>
{%- endif %}
</li>
{%- endfor %}
</ol>
